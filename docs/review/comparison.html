al-texture</h2><div class="grid"><figure><a href="webgpu-natural-texture-truth.png"><img src="webgpu-natural-texture-truth.png" alt="고해상도 합성 기준" loading="lazy"></a><figcaption>고해상도 합성 기준</figcaption></figure><figure><a href="webgpu-natural-texture-baseline.png"><img src="webgpu-natural-texture-baseline.png" alt="기존 Balanced" loading="lazy"></a><figcaption>기존 Balanced</figcaption></figure><figure><a href="webgpu-natural-texture-improved.png"><img src="webgpu-natural-texture-improved.png" alt="개선 Balanced" loading="lazy"></a><figcaption>개선 Balanced</figcaption></figure></div><h2>compressed-texture</h2><div class="grid"><figure><a href="webgpu-compressed-texture-truth.png"><img src="webgpu-compressed-texture-truth.png" alt="고해상도 합성 기준" loading="lazy"></a><figcaption>고해상도 합성 기준</figcaption></figure><figure><a href="webgpu-compressed-texture-baseline.png"><img src="webgpu-compressed-texture-baseline.png" alt="기존 Balanced" loading="lazy"></a><figcaption>기존 Balanced</figcaption></figure><figure><a href="webgpu-compressed-texture-improved.png"><img src="webgpu-compressed-texture-improved.png" alt="개선 Balanced" loading="lazy"></a><figcaption>개선 Balanced</figcaption></figure></div></main></html>
